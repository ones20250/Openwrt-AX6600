name: Cache-Clean

on:
  #schedule:
   # - cron: 0 20 * * 0
  workflow_dispatch:

permissions:
  actions: write

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  GH_REPO: ${{github.repository}}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Cache Clean
        run: gh cache delete --all --succeed-on-no-caches || true
